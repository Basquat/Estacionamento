  <script>
    tailwind.config = {
      darkMode: 'class',

          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          boxShadow: {

            fadeIn: { '0%': { opacity: 0, transform:'translateY(8px)' }, '100%': { opacity: 1, transform:'translateY(0)'} },
            pop: { '0%': { transform:'scale(0.95)', opacity:0 }, '100%': { transform:'scale(1)', opacity:1 }},
            blink: { '0%,100%':{opacity:.4}, '50%':{opacity:1} }

            blink: 'blink 1.2s ease-in-out infinite'
          }

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <meta name="color-scheme" content="light dark" />
  <style>
    ::-webkit-scrollbar{ width:10px; height:10px }
    ::-webkit-scrollbar-thumb{ background:rgba(100,100,100,.25); border-radius:999px }
    ::-webkit-scrollbar-track{ background:transparent }
    /* Campos têm largura intrínseca (~240px, o "size=20" padrão). Em grid/flex
       isso impedia o encolhimento e alargava a página inteira no celular. */
    input, select, textarea { min-width: 0; }

    /* 100vh no mobile conta o espaço da barra de endereço do navegador, então
       em páginas com pouco conteúdo o container ficava mais alto que a área
       visível e a barra "sticky bottom-0" grudava no fundo desse container
       maior, não no fundo real da tela — sobrava espaço em branco embaixo e
       parecia que a barra "subia". 100dvh acompanha a área visível de verdade;
       min-height acima é fallback pra navegador sem suporte a dvh. */
    .app-shell { min-height: 100vh; min-height: 100dvh; }

    @media (max-width: 640px){
      button, a, input, select { font-size: 16px; }
    }
  </style>

<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 selection:bg-blue-200 dark:selection:bg-blue-800/60">
<!--
  Tudo (header, conteúdo e menu de baixo) é renderizado pelo React dentro de
  #root. O menu virou troca de ABA (uma tela por item), não mais âncora
  "#secao" — âncora não funcionava em WebView/alguns navegadores e, mesmo
  funcionando, dava a impressão de que o botão não fazia nada.
-->
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useMemo, useRef } = React;

  function Icon({name, size = 20, className = ''}){
    const ref = useRef(null);
    useEffect(()=>{
      if(ref.current){
        ref.current.innerHTML = '';
        const i = document.createElement('i');
        i.setAttribute('data-lucide', name);
        i.className = className;
        ref.current.appendChild(i);
        try { window.lucide?.createIcons?.({root: ref.current}); } catch(e){}
      }
    }, [name, className]);
    return <span ref={ref} style={{display: 'inline-flex', width: size, height: size, alignItems: 'center', justifyContent: 'center'}}></span>;
  }

  const API_BASE = '/Automoveis';

  // "Início" já traz tudo que é preciso para operar (resumo + cadastro +
  // lista), por isso não existe um botão "Placas" separado.
  const ABAS = [
    { id:'inicio',     label:'Início',     icon:'home' },
    { id:'relatorios', label:'Relatórios', icon:'pie-chart' },
    { id:'blacklist',  label:'Blacklist',  icon:'ban' },
    { id:'config',     label:'Config',     icon:'settings' },
  ];

  // Estas abrem em tela própria; o resto fica na inicial.
  const TELAS_PROPRIAS = ['relatorios', 'blacklist', 'config'];

  function navDoHash(){
    const h = (location.hash || '').replace('#', '');
    return ABAS.some(a => a.id === h) ? h : 'inicio';
  }

  const METODOS_PAGAMENTO = [
    { value: 'dinheiro', label: 'Dinheiro' },
    { value: 'pix', label: 'Pix' },
  ];

  function formatBRL(value){
    if(value === '' || value === null || value === undefined) return '';
    const n = Number(value) || 0;
    return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }

  function uuid(){
    return crypto?.randomUUID?.() || ('id-' + Math.random().toString(36).slice(2));
  }

  function metodoLabel(metodo){
    if(metodo === 'nao_informado') return 'Não informado';
    return METODOS_PAGAMENTO.find(m => m.value === metodo)?.label || metodo;
  }

  // Soma só a parte que quita a conta do veículo (o troco NÃO entra aqui).
  function somaPagamentos(pagamentos){
    return (pagamentos || []).reduce((s, p) => s + (Number(p.valor) || 0), 0);
  }

  // Troco devolvido (dinheiro + Pix). Abate do caixa: valor final do veículo =
  // soma dos pagamentos (o que o cliente entregou) - troco devolvido.
  function somaTroco(pagamentos){
    return (pagamentos || []).reduce((s, p) => s + (Number(p.trocoDinheiro) || 0) + (Number(p.trocoPix) || 0), 0);
  }

  function round2(n){ return Math.round((Number(n) || 0) * 100) / 100; }

  // ---- Modelo de edição (UI) ----
  // Linha de pagamento na tela: { id, metodo, valor, trocos: [{id, tipo, valor}] }
  // (tipo '' = ainda não escolhido). Ao salvar vira { trocoDinheiro, trocoPix }.
  function novaLinha(valor = ''){
    return { id: uuid(), metodo: 'pix', valor, trocos: [] };
  }

  function linhaDoServidor(p){
    const trocos = [];
    if(Number(p.trocoDinheiro) > 0) trocos.push({ id: uuid(), tipo: 'dinheiro', valor: p.trocoDinheiro });
    if(Number(p.trocoPix) > 0) trocos.push({ id: uuid(), tipo: 'pix', valor: p.trocoPix });
    return {
      id: p.id || uuid(),
      metodo: p.metodo === 'nao_informado' ? 'pix' : p.metodo,
      valor: p.valor,
      trocos,
    };
  }

  function somaTrocosUI(linhas){
    return (linhas || []).reduce((s, l) => s + (l.trocos || []).reduce((t, x) => t + (Number(x.valor) || 0), 0), 0);
  }

  // Valida as linhas, calcula o valor final (recebido - troco) e, se diferir
  // do previsto, pede confirmação. Retorna { erro } | { cancelado } | { pagamentos, valorFinal }.
  function finalizarPagamento(linhas, previsto){
    if(!linhas || linhas.length === 0) return { erro: 'Adicione ao menos uma forma de pagamento.' };
    const pagamentos = [];
    for(const l of linhas){
      const t = { dinheiro: 0, pix: 0 };
      for(const tr of (l.trocos || [])){
        const v = Number(tr.valor) || 0;
        if(v <= 0) continue;
        if(!tr.tipo) return { erro: 'Escolha se o troco é em Dinheiro ou Pix.' };
        t[tr.tipo] += v;
      }
      pagamentos.push({
        id: l.id || uuid(),
        metodo: l.metodo,
        valor: Number(l.valor) || 0,
        trocoDinheiro: t.dinheiro,
        trocoPix: t.pix,
      });
    }
    const valorFinal = round2(somaPagamentos(pagamentos) - somaTroco(pagamentos));
    if(valorFinal <= 0) return { erro: 'O valor recebido (descontado o troco) precisa ser maior que zero.' };
    const prev = round2(previsto);
    if(Math.abs(valorFinal - prev) > 0.01){
      const ok = confirm('O valor recebido (' + formatBRL(valorFinal) + ') é diferente do previsto (' + formatBRL(prev) + '): '
              + (valorFinal > prev ? '+' : '-') + formatBRL(Math.abs(valorFinal - prev)) + '.\n\nConfirmar mesmo assim?');
      if(!ok) return { cancelado: true };
    }
    return { pagamentos, valorFinal };
  }

  // Redimensiona a foto no navegador (canvas nativo) antes de mandar pro
  // servidor — sem isso uma foto de celular (4-8MB) viraria uma linha gigante
  // de base64 no banco. Devolve um data URL JPEG já pequeno.
  function resizeImageFile(file, maxDim = 900, quality = 0.75){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Arquivo não é uma imagem válida'));
        img.onload = () => {
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            const escala = maxDim / Math.max(width, height);
            width = Math.round(width * escala);
            height = Math.round(height * escala);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Compatibiliza itens vindos do back-end antigo (campo único
  // `metodoPagamento`) com o novo formato (`pagamentos: [...]`).
  function migrateItem(item){
    let pagamentos;
    if(Array.isArray(item.pagamentos)){
      pagamentos = item.pagamentos.map(p => ({
        id: p.id || uuid(),
        metodo: p.metodo || p.metodoPagamento || 'nao_informado',
        valor: Number(p.valor) || 0,
        trocoDinheiro: Number(p.trocoDinheiro ?? p.troco) || 0,
        trocoPix: Number(p.trocoPix) || 0,
      }));
    } else if(item.pago && item.metodoPagamento){
      pagamentos = [{ id: uuid(), metodo: item.metodoPagamento, valor: Number(item.valor) || 0, trocoDinheiro: 0, trocoPix: 0 }];
    } else {
      pagamentos = [];
    }
    // Veículo marcado como pago no back-end mas sem detalhamento de método
    // (dados antigos): joga o valor num balde "não informado" para não sumir
    // do resumo — basta reabrir o veículo e escolher a forma correta.
    if(item.pago && pagamentos.length === 0){
      pagamentos = [{ id: uuid(), metodo: 'nao_informado', valor: Number(item.valor) || 0, trocoDinheiro: 0, trocoPix: 0 }];
    }
    const { metodoPagamento, ...rest } = item;
    return { ...rest, pagamentos };
  }

  async function parseErro(res, padrao){
    try{
      const data = await res.json();
      return data?.message || padrao;
    }catch{
      return padrao;
    }
  }

  // --------- Componentes ---------
  function StatCard({icon, label, value, sub}){
    return (
            <div className="group p-3 sm:p-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white/70 dark:bg-zinc-900/40 shadow-sm hover:shadow-md transition animate-fadeIn">
              <div className="flex items-center gap-2 sm:gap-3">
            <span className="inline-flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 shrink-0 rounded-xl bg-blue-600/10 text-blue-700 dark:text-blue-300">
              <Icon name={icon} className="w-5 h-5" />
            </span>
                <div className="flex-1 min-w-0">
                  <div className="text-[11px] sm:text-xs uppercase tracking-wider text-zinc-500 dark:text-zinc-400 truncate">{label}</div>
                  {/* text-[15px] no celular: "R$ 1.234,56" não cabia em text-lg
                      dentro de um card de 2 colunas e saía cortado. */}
                  <div className="text-[15px] sm:text-2xl font-semibold truncate">{value}</div>
                  {sub && <div className="text-[11px] sm:text-xs text-zinc-500 dark:text-zinc-400 mt-0.5 sm:mt-1">{sub}</div>}
                </div>
              </div>
            </div>
    )
  }

  function Tabs({tab, setTab}){
    const tabs = [
      {id:'todos', label:'Todos', icon:'list'},
      {id:'carro', label:'Carros', icon:'car'},
      {id:'moto', label:'Motos', icon:'motorbike'},
    ];
    return (
            <div className="flex w-full min-w-0 overflow-x-auto gap-2 pb-1">
              {tabs.map(t => (
                      <button key={t.id}
                              onClick={() => setTab(t.id)}
                              className={
                                      'shrink-0 flex items-center gap-2 px-4 py-2 rounded-2xl border transition ' +
                                      (tab===t.id
                                              ? 'bg-blue-600 text-white border-blue-600 shadow-glow'
                                              : 'bg-white/70 dark:bg-zinc-900/40 border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800')
                              }>
                        <Icon name={t.icon} className="w-4 h-4" />
                        <span>{t.label}</span>
                      </button>
              ))}
            </div>
    )
  }

  function PaymentFilter({paymentFilter, setPaymentFilter}){
    const filters = [
      {id:'todos', label:'Todos', icon:'list'},
      {id:'pagos', label:'Pagos', icon:'badge-check'},
      {id:'pendentes', label:'Pendentes', icon:'clock'},
    ];
    return (
            <div className="flex w-full min-w-0 overflow-x-auto gap-2 pb-1">
              {filters.map(f => (
                      <button key={f.id}
                              onClick={() => setPaymentFilter(f.id)}
                              className={
                                      'shrink-0 flex items-center gap-2 px-4 py-2 rounded-2xl border transition ' +
                                      (paymentFilter===f.id
                                              ? 'bg-blue-600 text-white border-blue-600 shadow-glow'
                                              : 'bg-white/70 dark:bg-zinc-900/40 border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800')
                              }>
                        <Icon name={f.icon} className="w-4 h-4" />
                        <span>{f.label}</span>
                      </button>
              ))}
            </div>
    )
  }

  // Editor de pagamento dividido. `valor` de cada linha = o que o cliente
  // ENTREGOU naquela forma; o troco devolvido (dinheiro e/ou Pix) é descontado.
  // Valor final = soma das linhas - trocos. Não precisa bater com o previsto:
  // se for diferente, o salvamento pede confirmação.
  function PaymentSplitEditor({valorPrevisto, pagamentos, setPagamentos}){
    const bruto = somaPagamentos(pagamentos);
    const trocoTotal = somaTrocosUI(pagamentos);
    const liquido = round2(bruto - trocoTotal);
    const previsto = round2(valorPrevisto);
    const dif = round2(liquido - previsto);
    const restante = round2(previsto - liquido);

    function addLinha(){
      setPagamentos(prev => [...prev, novaLinha(restante > 0 ? restante : '')]);
    }
    function patchLinha(id, fn){
      setPagamentos(prev => prev.map(l => l.id === id ? fn(l) : l));
    }
    function updateLinha(id, field, value){
      patchLinha(id, l => ({ ...l, [field]: value }));
    }
    function removeLinha(id){
      setPagamentos(prev => prev.filter(l => l.id !== id));
    }
    function addTroco(id){
      patchLinha(id, l => ({ ...l, trocos: [...(l.trocos || []), { id: uuid(), tipo: '', valor: '' }] }));
    }
    function updateTroco(id, tid, field, value){
      patchLinha(id, l => ({ ...l, trocos: l.trocos.map(t => t.id === tid ? { ...t, [field]: value } : t) }));
    }
    function removeTroco(id, tid){
      patchLinha(id, l => ({ ...l, trocos: l.trocos.filter(t => t.id !== tid) }));
    }

    const inputCls = "w-full min-w-0 px-2 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-sm outline-none focus:ring-4 focus:ring-blue-500/20";
    const trocoInputCls = "w-full min-w-0 px-2 py-2 rounded-xl border border-amber-200 dark:border-amber-900/50 bg-white dark:bg-zinc-900 text-sm outline-none focus:ring-4 focus:ring-amber-500/20";

    return (
            <div className="grid grid-cols-1 gap-2 p-3 rounded-xl bg-zinc-100/70 dark:bg-zinc-800/50 border border-zinc-200 dark:border-zinc-700">
              {pagamentos.length === 0 && (
                      <div className="text-xs text-zinc-500 dark:text-zinc-400">Nenhuma forma de pagamento adicionada ainda.</div>
              )}
              {pagamentos.map(l => (
                      <div key={l.id} className="grid grid-cols-1 gap-2 pb-2 border-b border-zinc-200/70 dark:border-zinc-700/70 last:border-b-0 last:pb-0">
                        <div className="flex items-start gap-2">
                          <div className="flex-1 min-w-0 flex flex-wrap items-center gap-2">
                            <select value={l.metodo} onChange={e=>updateLinha(l.id,'metodo',e.target.value)}
                                    className="flex-1 min-w-[84px] px-2 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-sm">
                              {METODOS_PAGAMENTO.map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
                            </select>
                            <label className="flex items-center gap-1 flex-1 min-w-[96px]" title="Valor que o cliente entregou nesta forma de pagamento">
                              <span className="text-[11px] text-zinc-500 dark:text-zinc-400">R$</span>
                              <input type="number" step="0.01" min="0" placeholder="0,00" value={l.valor}
                                     onChange={e=>updateLinha(l.id,'valor', e.target.value.replace(',','.'))}
                                     className={inputCls}/>
                            </label>
                          </div>
                          <button type="button" onClick={()=>removeLinha(l.id)} title="Remover"
                                  className="shrink-0 p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600">
                            <Icon name="x" className="w-4 h-4" />
                          </button>
                        </div>

                        {(l.trocos || []).map(t => (
                                <div key={t.id} className="flex items-center gap-2 pl-3 border-l-2 border-amber-300 dark:border-amber-700/60">
                                  <span className="text-[11px] text-amber-700 dark:text-amber-300 shrink-0">Troco</span>
                                  <select value={t.tipo} onChange={e=>updateTroco(l.id,t.id,'tipo',e.target.value)}
                                          className="flex-1 min-w-[84px] px-2 py-2 rounded-xl border border-amber-200 dark:border-amber-900/50 bg-white dark:bg-zinc-900 text-sm">
                                    <option value="">Escolha…</option>
                                    {METODOS_PAGAMENTO.map(m => (
                                            <option key={m.value} value={m.value}
                                                    disabled={(l.trocos||[]).some(o => o.id !== t.id && o.tipo === m.value)}>{m.label}</option>
                                    ))}
                                  </select>
                                  <input type="number" step="0.01" min="0" placeholder="0,00" value={t.valor}
                                         onChange={e=>updateTroco(l.id,t.id,'valor', e.target.value.replace(',','.'))}
                                         className={trocoInputCls + " flex-1"}/>
                                  <button type="button" onClick={()=>removeTroco(l.id,t.id)} title="Remover troco"
                                          className="shrink-0 p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600">
                                    <Icon name="x" className="w-4 h-4" />
                                  </button>
                                </div>
                        ))}
                        {(l.trocos || []).length < 2 && (
                                <button type="button" onClick={()=>addTroco(l.id)}
                                        className="justify-self-start inline-flex items-center gap-1 text-xs font-medium text-amber-700 dark:text-amber-300 hover:underline">
                                  <Icon name="plus" className="w-3 h-3" /> Troco
                                </button>
                        )}
                      </div>
              ))}
              <div className="flex items-center justify-between flex-wrap gap-2 pt-1">
                <button type="button" onClick={addLinha}
                        className="inline-flex items-center gap-1 text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline">
                  <Icon name="plus" className="w-3.5 h-3.5" /> Adicionar forma de pagamento
                </button>
                <div className="flex items-center gap-2 flex-wrap">
                  {trocoTotal > 0 && (
                          <span className="text-xs font-semibold px-2 py-1 rounded-lg text-amber-700 bg-amber-100 dark:text-amber-300 dark:bg-amber-900/30">
                            Troco {formatBRL(trocoTotal)}
                          </span>
                  )}
                  <span className="text-xs font-semibold px-2 py-1 rounded-lg text-zinc-700 bg-zinc-200 dark:text-zinc-200 dark:bg-zinc-700">
                    Recebido {formatBRL(liquido)}
                  </span>
                  <span className={'text-xs font-semibold px-2 py-1 rounded-lg '+(Math.abs(dif) < 0.01 ? 'text-emerald-700 bg-emerald-100 dark:text-emerald-300 dark:bg-emerald-900/30' : 'text-amber-700 bg-amber-100 dark:text-amber-300 dark:bg-amber-900/30')}>
                    {Math.abs(dif) < 0.01 ? 'Igual ao previsto ✓' : ((dif > 0 ? '+' : '-') + formatBRL(Math.abs(dif)) + ' vs previsto')}
                  </span>
                </div>
              </div>
            </div>
    )
  }

  function AddForm({onAdd}){
    const [placa, setPlaca] = useState('');
    const [tipo, setTipo] = useState('carro');
    const [valor, setValor] = useState('');
    const [pago, setPago] = useState(false);
    const [pagamentos, setPagamentos] = useState([]);
    const [saving, setSaving] = useState(false);

    function togglePago(checked){
      setPago(checked);
      if(checked && pagamentos.length === 0){
        setPagamentos([novaLinha(valor || '')]);
      }
      if(!checked){
        setPagamentos([]);
      }
    }

    async function handleSubmit(e){
      e.preventDefault();
      if(!placa.trim() || saving) return;

      let pagamentosFinal = [];
      let valorEnvio = Number(valor) || 0;
      let valorPrevisto = null;
      if(pago){
        const r = finalizarPagamento(pagamentos, valor);
        if(r.erro){ alert(r.erro); return; }
        if(r.cancelado) return;
        pagamentosFinal = r.pagamentos;
        valorPrevisto = Number(valor) || 0;
        valorEnvio = r.valorFinal;
      }

      const novo = {
        id: uuid(),
        placa: placa.trim().toUpperCase(),
        tipo,
        valor: valorEnvio,
        valorPrevisto,
        pago,
        pagamentos: pagamentosFinal,
        entrada: Date.now()
      };

      setSaving(true);
      try{
        if(await onAdd(novo)){
          setPlaca('');
          setValor('');
          setPago(false);
          setTipo('carro');
          setPagamentos([]);
        }
      } finally {
        setSaving(false);
      }
    }

    return (

  function Row({item, onUpdate, onDelete}){
    const [editing, setEditing] = useState(false);
    const [tempPlaca, setTempPlaca] = useState(item.placa);
    const [tempTipo, setTempTipo] = useState(item.tipo);
    const [tempValor, setTempValor] = useState(item.valor);
    const [tempPago, setTempPago] = useState(item.pago);
    const [tempPagamentos, setTempPagamentos] = useState([]);
    const [saving, setSaving] = useState(false);

    const trocoLinha = somaTroco(item.pagamentos);
    // Veículo pago: `valor` é o valor final recebido; `valorPrevisto` o da chegada.
    const previstoItem = (item.pago && item.valorPrevisto != null) ? Number(item.valorPrevisto) : null;

    // Abre o editor sempre a partir do estado atual do veículo. Um veículo já
    // pago PODE ser reeditado (valor, método, troco) — podem ocorrer correções.
    function abrirEditor(){
      setTempPlaca(item.placa);
      setTempTipo(item.tipo);
      const valorBase = previstoItem != null ? previstoItem : item.valor;
      setTempValor(valorBase);
      setTempPago(item.pago);
      setTempPagamentos(
              (item.pagamentos && item.pagamentos.length)
                      ? item.pagamentos.map(linhaDoServidor)
                      : [novaLinha(valorBase)]
      );
      setEditing(true);
    }

    function togglePago(checked){
      setTempPago(checked);
      if(checked && tempPagamentos.length === 0){
        setTempPagamentos([novaLinha(tempValor || '')]);
      }
      if(!checked){
        setTempPagamentos([]);
      }
    }

    async function salvar(){
      if(saving) return;
      const valorNum = Number(tempValor) || 0;
      let pagamentosFinal = [];
      let valorEnvio = valorNum;
      let valorPrevisto = null;
      if(tempPago){
        if(tempPagamentos.length === 0){
          alert('Adicione ao menos uma forma de pagamento.');
          return;
        }
        const r = finalizarPagamento(tempPagamentos, valorNum);
        if(r.erro){ alert(r.erro); return; }
        if(r.cancelado) return;
        pagamentosFinal = r.pagamentos;
        valorEnvio = r.valorFinal;
        valorPrevisto = valorNum;
      }
      setSaving(true);
      try{
        await onUpdate(item.id, {
          placa: (tempPlaca || '').trim().toUpperCase(),
          tipo: tempTipo,
          valor: valorEnvio,
          valorPrevisto,
          pago: tempPago,
          pagamentos: pagamentosFinal,
        });
        setEditing(false);
      } finally {
        setSaving(false);
      }
    }

    return (
            <div className="p-3 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white/70 dark:bg-zinc-900/40 hover:shadow-sm transition animate-fadeIn">
              <div className="flex items-center gap-3">
            <span className={'inline-flex items-center justify-center w-10 h-10 shrink-0 rounded-xl '+(item.tipo==='carro' ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-300' : 'bg-fuchsia-500/10 text-fuchsia-600 dark:text-fuchsia-300')}>
              <Icon name={item.tipo==='carro'?'car':'motorbike'} className="w-5 h-5" />
            </span>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold tracking-wide">{item.placa}</div>
                  <div className="text-xs text-zinc-500 dark:text-zinc-400">{new Date(item.entrada).toLocaleString('pt-BR')}</div>
                </div>
              </div>

              {/* Linha 2: status (pode ser longo/quebrar) à esquerda, valor+ações
                  SEMPRE juntos à direita — evita os botões "flutuarem" sozinhos
                  numa linha separada quando o texto do status é grande (pagamento
                  dividido + troco). */}
              <div className="mt-2 flex items-start justify-between gap-3 flex-wrap">
                <div className={"text-sm font-medium min-w-0 "+(item.pago?'text-emerald-600 dark:text-emerald-400':'text-amber-600 dark:text-amber-400')}>
                  {item.pago
                          ? ('Pago (' + (item.pagamentos||[]).map(p => metodoLabel(p.metodo) + ' ' + formatBRL(p.valor)).join(' + ')
                                  + (trocoLinha > 0 ? ' · troco ' + formatBRL(trocoLinha) : '') + ')')
                          : 'Pendente'}
                  {previstoItem != null && Math.abs(previstoItem - item.valor) > 0.01 && (
                          <span className="block text-xs font-normal text-zinc-500 dark:text-zinc-400">previsto {formatBRL(previstoItem)}</span>
                  )}
                </div>
                <div className="flex items-center gap-3 shrink-0 ml-auto">
                  <div className="text-lg font-semibold">{formatBRL(item.valor)}</div>
                  <div className="flex items-center gap-1">
                    <button onClick={()=> editing ? setEditing(false) : abrirEditor()} title="Editar veículo / pagamento"
                            className={'p-2.5 sm:p-2 rounded-xl transition '+(editing ? 'bg-blue-600 text-white' : 'hover:bg-zinc-100 dark:hover:bg-zinc-800')}>
                      <Icon name={item.pago ? 'pencil' : 'badge-check'} className="w-5 h-5" />
                    </button>
                    <button onClick={()=>onDelete(item.id)} title="Remover" className="p-2.5 sm:p-2 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600"><Icon name="trash-2" className="w-5 h-5" /></button>
                  </div>
                </div>
              </div>

              {editing && (
                      <div className="mt-3 grid grid-cols-1 gap-3 border-t border-zinc-200 dark:border-zinc-800 pt-3 animate-fadeIn">
                        <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                          <div>
                            <label className="text-xs text-zinc-500 dark:text-zinc-400">Placa</label>
                            <input value={tempPlaca} onChange={e=>setTempPlaca(e.target.value)}
                                   className="w-full mt-1 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 outline-none focus:ring-4 focus:ring-blue-500/20"/>
                          </div>
                          <div>
                            <label className="text-xs text-zinc-500 dark:text-zinc-400">Tipo</label>
                            <select value={tempTipo} onChange={e=>setTempTipo(e.target.value)}
                                    className="w-full mt-1 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 outline-none focus:ring-4 focus:ring-blue-500/20">
                              <option value="carro">Carro</option>
                              <option value="moto">Moto</option>
                            </select>
                          </div>
                          <div>
                            <label className="text-xs text-zinc-500 dark:text-zinc-400">Valor previsto (R$)</label>
                            <input type="number" step="0.01" min="0" value={tempValor}
                                   onChange={e=>setTempValor(e.target.value.replace(',','.'))}
                                   className="w-full mt-1 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 outline-none focus:ring-4 focus:ring-blue-500/20"/>
                          </div>
                        </div>

                        <label className="flex items-center gap-2 text-sm">
                          <input type="checkbox" checked={tempPago} onChange={e=>togglePago(e.target.checked)} className="w-4 h-4 rounded border-zinc-300 text-blue-600"/>
                          Pagamento confirmado
                        </label>

                        {tempPago && (
                                <PaymentSplitEditor valorPrevisto={Number(tempValor)||0} pagamentos={tempPagamentos} setPagamentos={setTempPagamentos} />
                        )}

                        <div className="flex items-center justify-end gap-2 flex-wrap">
                          <button type="button" onClick={()=>setEditing(false)} className="px-3 py-1.5 rounded-xl border border-zinc-200 dark:border-zinc-800">Cancelar</button>
                          <button type="button" onClick={salvar} disabled={saving} className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white hover:brightness-110 disabled:opacity-50">
                            {saving ? 'Salvando...' : 'Salvar'}
                          </button>
                        </div>
                      </div>
              )}
            </div>
    )
  }

  function List({items, search, tab, paymentFilter, ...handlers}){
    const filtered = items.filter(it =>
            (tab==='todos' || it.tipo===tab) &&
            it.placa.toLowerCase().includes(search.toLowerCase()) &&

            <div className="grid grid-cols-1 gap-3">

  function BlacklistForm({onAdd}){
    const [placa, setPlaca] = useState('');
    const [motivo, setMotivo] = useState('');
    const [foto, setFoto] = useState(null);
    const [erroFoto, setErroFoto] = useState('');
    const [saving, setSaving] = useState(false);

    async function handleFoto(e){
      const file = e.target.files?.[0];
      if(!file) return;
      setErroFoto('');
      try{
        setFoto(await resizeImageFile(file));
      }catch(err){
        setErroFoto(err.message || 'Falha ao processar a foto');
      }
    }

    async function handleSubmit(e){
      e.preventDefault();
      if(!placa.trim() || saving) return;
      setSaving(true);
      try{
        await onAdd({
          id: uuid(),
          placa: placa.trim().toUpperCase(),
          motivo: motivo.trim(),
          foto,
          criadoEm: Date.now(),
        });
        setPlaca(''); setMotivo(''); setFoto(null); setErroFoto('');
        e.target.reset();
      } finally {
        setSaving(false);
      }
    }

    return (
            <form onSubmit={handleSubmit} className="grid grid-cols-1 gap-3 min-w-0 p-3 sm:p-4 rounded-2xl border border-red-200 dark:border-red-900/40 bg-white/70 dark:bg-zinc-900/40 animate-fadeIn">
              <div className="grid grid-cols-1 gap-3 min-w-0 sm:grid-cols-2 md:grid-cols-12 md:items-end">
                <div className="md:col-span-3">
                  <label className="text-xs text-zinc-500 dark:text-zinc-400">Placa</label>
                  <input value={placa} onChange={e=>setPlaca(e.target.value)} placeholder="ABC-1234"
                         className="w-full mt-1 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 outline-none focus:ring-4 focus:ring-red-500/20"/>

                  <label className="text-xs text-zinc-500 dark:text-zinc-400">Motivo (opcional)</label>

                </div>
                <div className="md:col-span-3 min-w-0">
                  <label className="text-xs text-zinc-500 dark:text-zinc-400">Foto (opcional)</label>
                  {/* input de arquivo escondido + label estilizado: o input
                      nativo tem largura mínima grande ("Escolher arquivo /
                      Nenhum arquivo selecionado") e estourava a tela no
                      celular. Mesmo padrão já usado no Importar das Configs. */}
                  <label className="mt-1 w-full inline-flex items-center justify-center gap-2 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 cursor-pointer text-sm truncate">
                    <Icon name="camera" className="w-4 h-4 shrink-0" />
                    <span className="truncate">{foto ? 'Trocar foto' : 'Escolher foto'}</span>
                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFoto}/>
                  </label>
                </div>
                <div className="md:col-span-1 flex justify-end">
                  <button disabled={saving} className="w-full md:w-auto inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-red-600 text-white hover:brightness-110 active:scale-95 transition disabled:opacity-50">
                    <Icon name="ban" className="w-4 h-4" />
                    {saving ? 'Salvando...' : 'Adicionar'}
                  </button>
                </div>
              </div>
              {erroFoto && <div className="text-xs text-red-600">{erroFoto}</div>}
              {foto && (
                      <div className="flex items-center gap-2">
                        <img src={foto} alt="Prévia da foto" className="w-16 h-16 rounded-xl object-cover border border-zinc-200 dark:border-zinc-800"/>
                        <button type="button" onClick={()=>setFoto(null)} className="text-xs text-red-600 hover:underline">Remover foto</button>
                      </div>

  function ConfigPainel({theme, setTheme, items, loadItems, clearAll}){

                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <div className="font-semibold">Dados</div>
                    <div className="text-sm text-zinc-500 dark:text-zinc-400">Backup (exporta o que está carregado) e restauração via API</div>
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <button onClick={()=>{
                      const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
                      const url = URL.createObjectURL(blob);
                      const a = Object.assign(document.createElement('a'), { href:url, download:'backup_estaciona_plus.json' });
                      a.click(); URL.revokeObjectURL(url);
                    }}
                            className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white hover:brightness-110">Exportar</button>
                    <label className="px-3 py-1.5 rounded-xl border border-zinc-200 dark:border-zinc-800 cursor-pointer">
                      Importar
                      <input type="file" accept="application/json" className="hidden" onChange={e=>{
                        const file = e.target.files?.[0];
                        if(!file) return;
                        const reader = new FileReader();
                        reader.onload = async () => {
                          try{
                            const raw = JSON.parse(reader.result);
                            const data = Array.isArray(raw) ? raw : (Array.isArray(raw?.items) ? raw.items : null);
                            if(!data){ alert('Arquivo inválido'); return; }
                            const itensMigrados = data.map(migrateItem);
                            for(const item of itensMigrados){
                              await fetch(API_BASE + '/Add', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(item)
                              });
                            }
                            await loadItems();
                          }
                          catch{ alert('Falha ao importar'); }
                        };
                        reader.readAsText(file);
                      }}/>
                    </label>
                    <button onClick={clearAll} className="px-3 py-1.5 rounded-xl bg-red-600 text-white hover:brightness-110">Limpar tudo</button>
                  </div>
                </div>
              </div>
            </div>
    )
  }

  function Section({id, title, subtitle, children, action}){
    return (
            // min-w-0: como itens de grid não encolhem por padrão, sem isso
            // qualquer conteúdo largo aqui dentro alargaria a página inteira.
            <section id={id} className="scroll-mt-24 min-w-0 py-6">
              <div className="flex items-end justify-between mb-3 gap-2 flex-wrap">
                <div>
                  <h2 className="text-xl sm:text-2xl font-bold tracking-tight">{title}</h2>
                  {subtitle && <p className="text-sm text-zinc-500 dark:text-zinc-400">{subtitle}</p>}
                </div>
                {action}
              </div>
              {children}
            </section>
    )
  }

  // localStorage pode lançar (aba anônima, WebView, política corporativa) —
  // sem isso o React desmontava o app inteiro (tela em branco, sem aviso).
  function useTheme(){
    const [theme, setTheme] = useState(() => {
      try {
        const saved = localStorage.getItem('theme');
        if(saved) return saved;
      } catch {}
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    });
    useEffect(()=>{
      const root = document.documentElement;
      if(theme==='dark') root.classList.add('dark'); else root.classList.remove('dark');
      try { localStorage.setItem('theme', theme); } catch {}
    }, [theme]);
    return [theme, setTheme];
  }

  function App(){
    const [theme, setTheme] = useTheme();
    const [items, setItems] = useState([]);
    const [blacklist, setBlacklist] = useState([]);
    // `loading` só é usado na primeira carga (tela cheia de "Carregando...").
    // `refreshing` é usado nas atualizações em segundo plano (disparadas por
    // outro dispositivo via SSE) e NUNCA desmonta a tela — assim o que o
    // usuário está digitando (form de adicionar, painel de pagamento aberto
    // etc.) não some quando alguém em outro aparelho salva algo.
    const [loading, setLoading] = useState(true);
    const [refreshing, setRefreshing] = useState(false);
    const [tab, setTab] = useState('todos');
    const [search, setSearch] = useState('');
    const [paymentFilter, setPaymentFilter] = useState('todos');

    // `navId` = item do menu clicado (para destacar). A TELA é derivada dele:
    // só Relatórios e Blacklist têm tela própria; o resto fica na inicial.
    const [navId, setNavId] = useState(navDoHash);
    const aba = TELAS_PROPRIAS.includes(navId) ? navId : 'inicio';

    function irPara(id){
      setNavId(id);
      try { history.replaceState(null, '', '#' + id); } catch {}
      if(TELAS_PROPRIAS.includes(id)){
        window.scrollTo(0, 0);
        return;
      }
      // Volta pra inicial e rola até a seção. O setTimeout deixa o React
      // renderizar a tela inicial antes de procurar o elemento.
      setTimeout(() => {
        const alvo = document.getElementById(id);
        if(alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        else window.scrollTo(0, 0);
      }, 0);
    }

    useEffect(()=>{
      const onHash = () => setNavId(navDoHash());
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    // Cada mutação local deixa um "carimbo" aqui. O evento SSE que o próprio
    // servidor devolve por causa dessa mutação é consumido (não dispara um
    // reload da lista inteira) — a tela já foi atualizada com a resposta do
    // POST/PUT. Eventos de OUTROS dispositivos passam direto e recarregam.
    const ecosLocais = useRef([]);
    function marcarAcaoLocal(){
      ecosLocais.current.push(Date.now());
    }

    useEffect(()=>{ loadItems(); loadBlacklist(); }, []);

    // Atualização em tempo real via Server-Sent Events. O EventSource reconecta
    // sozinho se a conexão cair (comportamento padrão do browser).
    useEffect(()=>{
      const src = new EventSource('/eventos');
      let timer = null;
      let vivo = true;

      const agendarReload = () => {
        if(timer) clearTimeout(timer);
        // debounce: uma rajada de eventos (ex.: "limpar tudo") vira 1 reload.
        timer = setTimeout(() => {
          if(!vivo) return;
          const agora = Date.now();
          ecosLocais.current = ecosLocais.current.filter(t => agora - t < 4000);
          if(ecosLocais.current.length > 0){
            ecosLocais.current.shift(); // consome o eco da própria ação
            return;
          }
          loadItems({ silent: true });
          loadBlacklist();
        }, 350);
      };

      src.addEventListener('atualizacao', agendarReload);
      // ATENÇÃO: onerror é propriedade (atribuição), não um método. Chamar
      // `src.onerror(fn)` executaria `null` como função e quebraria o app.
      src.onerror = () => { /* EventSource já reconecta sozinho */ };

      return () => { vivo = false; if(timer) clearTimeout(timer); src.close(); };
    }, []);

    useEffect(()=>{
      setTimeout(()=>window?.lucide?.createIcons?.(), 0);
    }, [items, blacklist, tab, search, theme, loading, aba]);

    // `silent = true` é usado nas atualizações vindas de outro dispositivo:
    // busca os dados novos e atualiza a lista SEM trocar a tela toda por um
    // spinner e sem interromper o que o usuário estiver fazendo.
    async function loadItems({ silent = false } = {}){
      if(silent) setRefreshing(true); else setLoading(true);
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(await parseErro(res, 'Falha ao carregar dados'));
        const data = await res.json();
        // API devolve { automoveis: [...], total } (AutoListResponse)
        const lista = Array.isArray(data) ? data : (data.automoveis || []);
        setItems(lista.map(migrateItem));
      } catch (err) {
        if(!silent) alert(err.message || 'Erro ao carregar dados');
        else console.error('Falha ao sincronizar em segundo plano:', err);
      } finally {
        if(silent) setRefreshing(false); else setLoading(false);
      }
    }

    // Devolve true só quando o veículo realmente entrou — o formulário só
    // limpa os campos nesse caso (antes limpava até quando dava erro).
    async function addItem(novo){
      const placaNova = (novo.placa || '').trim().toUpperCase();
      if(items.some(i => ((i.placa||'').trim().toUpperCase() === placaNova))){
        alert('A placa ' + placaNova + ' já está cadastrada.');
        return false;
      }

      // A blacklist NÃO bloqueia a entrada: o veículo pode voltar a usar o
      // estacionamento. Só avisa o operador do que aconteceu antes, com data,
      // e pede confirmação.
      const ocorrencias = blacklist.filter(b => (b.placa||'').trim().toUpperCase() === placaNova);
      if(ocorrencias.length > 0){
        const historico = ocorrencias
                .map(b => '• ' + new Date(b.criadoEm).toLocaleString('pt-BR')
                        + (b.motivo ? ' — ' + b.motivo : ' — (sem motivo registrado)'))
                .join('\n');
        const confirmado = confirm(
                'ATENÇÃO: a placa ' + placaNova + ' está na BLACKLIST.\n\n'
                + historico
                + '\n\nDeseja cadastrar este veículo mesmo assim?'
        );
        if(!confirmado) return false;
      }

      try {
        const res = await fetch(API_BASE + '/Add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novo)
        });
        if (!res.ok) throw new Error(await parseErro(res, 'Erro ao adicionar'));
        const saved = await res.json();
        marcarAcaoLocal();
        setItems(prev => [migrateItem(saved), ...prev]);
        return true;
      } catch (err) {
        alert(err.message || 'Erro ao adicionar');
        return false;
      }
    }

    // Edição unificada do veículo: placa, tipo, valor, status de pagamento e
    // formas de pagamento (com troco). Funciona também para veículos já pagos —
    // não há mais trava; correções acontecem.
    async function updateItem(id, patch){
      const item = items.find(i => i.id === id);
      if (!item) return;
      const placaNova = (patch.placa || '').trim().toUpperCase();
      if (placaNova && placaNova !== (item.placa||'').trim().toUpperCase()
              && items.some(i => i.id !== id && (i.placa||'').trim().toUpperCase() === placaNova)){
        alert('A placa ' + placaNova + ' já está cadastrada.');
        return;
      }
      const updated = { ...item, ...patch };
      // Otimista: aplica na tela na hora e concilia com a resposta do servidor
      // (ou desfaz se der erro). A ida ao Render+Supabase não trava a UI.
      const anterior = items;
      marcarAcaoLocal();
      setItems(prev => prev.map(i => i.id === id ? migrateItem(updated) : i));
      try {
        const res = await fetch(API_BASE + '/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updated)
        });
        if (!res.ok) throw new Error(await parseErro(res, 'Erro ao salvar'));
        const saved = await res.json();
        setItems(prev => prev.map(i => i.id === id ? migrateItem(saved) : i));
      } catch (err) {
        setItems(anterior);
        alert(err.message || 'Erro ao salvar');
      }
    }

    async function removeItem(id){
      // Otimista: some da tela imediatamente; se o servidor recusar, volta.
      const anterior = items;
      marcarAcaoLocal();
      setItems(prev => prev.filter(i => i.id !== id));
      try {
        const res = await fetch(API_BASE + '/' + id, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error(await parseErro(res, 'Erro ao remover'));
      } catch (err) {
        setItems(anterior);
        alert(err.message || 'Erro ao remover');
      }
    }

    async function clearAll(){
      if(!confirm('Tem certeza que deseja limpar tudo?')) return;
      const anterior = items;
      anterior.forEach(marcarAcaoLocal);
      setItems([]);
      try {
        await Promise.all(anterior.map(item => fetch(API_BASE + '/' + item.id, { method: 'DELETE' })));
      } catch (err) {
        setItems(anterior);
        alert(err.message || 'Erro ao limpar');
      }
    }

    async function loadBlacklist(){
      try {
        const res = await fetch('/Blacklist');
        if (!res.ok) throw new Error(await parseErro(res, 'Falha ao carregar blacklist'));
        setBlacklist(await res.json());
      } catch (err) {
        console.error('Falha ao carregar blacklist:', err);
      }
    }

    async function addBlacklistEntry(novo){
      try {
        const res = await fetch('/Blacklist/Add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novo)
        });
        if (!res.ok) throw new Error(await parseErro(res, 'Erro ao adicionar à blacklist'));
        const saved = await res.json();
        marcarAcaoLocal();
        setBlacklist(prev => [saved, ...prev]);
      } catch (err) {
        alert(err.message || 'Erro ao adicionar à blacklist');
      }
    }

    async function removeBlacklistEntry(id){
      const anterior = blacklist;
      marcarAcaoLocal();
      setBlacklist(prev => prev.filter(i => i.id !== id));
      try {
        const res = await fetch('/Blacklist/' + id, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error(await parseErro(res, 'Erro ao remover'));
      } catch (err) {
        setBlacklist(anterior);
        alert(err.message || 'Erro ao remover');
      }
    }

    const carros = useMemo(()=> items.filter(i=>i.tipo==='carro'), [items]);
    const motos = useMemo(()=> items.filter(i=>i.tipo==='moto'), [items]);

    // Caixa por método = o que o cliente entregou naquele método MENOS o troco
    // devolvido naquele tipo (troco em dinheiro sai do caixa de dinheiro; troco
    // em Pix sai do Pix). Soma de todos os métodos = valor final arrecadado.
    function totalPorMetodo(lista, metodo){
      const pags = lista.filter(i => i.pago).flatMap(i => i.pagamentos || []);
      const entregue = pags.filter(p => p.metodo === metodo).reduce((s,p) => s + (Number(p.valor)||0), 0);
      const devolvido = metodo === 'dinheiro' ? pags.reduce((s,p) => s + (Number(p.trocoDinheiro)||0), 0)
              : metodo === 'pix' ? pags.reduce((s,p) => s + (Number(p.trocoPix)||0), 0)
              : 0;
      return entregue - devolvido;
    }

    // Total de troco devolvido no período (informativo: já está abatido acima).
    function totalTrocoLista(lista){
      return lista
              .filter(i => i.pago)
              .reduce((s,i) => s + somaTroco(i.pagamentos), 0);
    }

    const totalCarros = useMemo(()=> carros.reduce((s,i)=>s+i.valor,0), [carros]);
    const totalCarrosPago = useMemo(()=> carros.filter(i=>i.pago).reduce((s,i)=>s+i.valor,0), [carros]);
    const totalCarrosDinheiro = useMemo(()=> totalPorMetodo(carros, 'dinheiro'), [carros]);
    const totalCarrosPix = useMemo(()=> totalPorMetodo(carros, 'pix'), [carros]);
    const totalCarrosSemMetodo = useMemo(()=> totalPorMetodo(carros, 'nao_informado'), [carros]);
    const trocoCarros = useMemo(()=> totalTrocoLista(carros), [carros]);
    const pendCarros = useMemo(()=> carros.filter(i=>!i.pago).reduce((s,i)=>s+i.valor,0), [carros]);

    const totalMotos = useMemo(()=> motos.reduce((s,i)=>s+i.valor,0), [motos]);
    const totalMotosPago = useMemo(()=> motos.filter(i=>i.pago).reduce((s,i)=>s+i.valor,0), [motos]);
    const totalMotosDinheiro = useMemo(()=> totalPorMetodo(motos, 'dinheiro'), [motos]);
    const totalMotosPix = useMemo(()=> totalPorMetodo(motos, 'pix'), [motos]);
    const totalMotosSemMetodo = useMemo(()=> totalPorMetodo(motos, 'nao_informado'), [motos]);
    const trocoMotos = useMemo(()=> totalTrocoLista(motos), [motos]);
    const pendMotos = useMemo(()=> motos.filter(i=>!i.pago).reduce((s,i)=>s+i.valor,0), [motos]);

    // Totais combinados (carro+moto) para o Resumo — com tantas formas de
    // pagamento e status, 8-10 cards separados por tipo ficava poluído. O
    // Resumo agora mostra só os números-chave; o detalhe por tipo continua
    // inteiro em Relatórios.
    const totalArrecadado = totalCarrosPago + totalMotosPago;
    const totalPendente = pendCarros + pendMotos;
    const totalDinheiro = totalCarrosDinheiro + totalMotosDinheiro;
    const totalPix = totalCarrosPix + totalMotosPix;
    const trocoTotal = trocoCarros + trocoMotos;

    return (
            <div className="app-shell flex flex-col">
              <Header navId={navId} irPara={irPara} theme={theme} setTheme={setTheme} />

              {/* pb-24 no mobile: espaço para o menu fixo de baixo não cobrir
                  o último item quando a tela é curta. */}
              <main className="flex-1 max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-6 pb-24 md:pb-8">
              {refreshing && (
                      <div className="fixed top-16 right-3 z-50 flex items-center gap-2 px-3 py-1.5 rounded-full bg-zinc-900/90 dark:bg-zinc-100/90 text-white dark:text-zinc-900 text-xs shadow-lg animate-fadeIn">
                        <Icon name="loader-circle" className="w-3.5 h-3.5 animate-spin" />
                        Sincronizando...
                      </div>
              )}

              {loading && (
                      <div className="flex items-center justify-center py-24 gap-2 text-zinc-500 dark:text-zinc-400">
                        <Icon name="loader-circle" className="w-5 h-5 animate-spin" />
                        Carregando...
                      </div>
              )}

              {!loading && aba === 'inicio' && (
              <div className="grid grid-cols-1 gap-8">
              <Section id="inicio" title="Resumo" subtitle="Visão geral rápida do caixa e movimentação">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
                  <StatCard icon="car" label="Carros" value={formatBRL(totalCarros)} sub={`${carros.length} no pátio · ${formatBRL(totalCarrosPago)} pago`} />
                  <StatCard icon="motorbike" label="Motos" value={formatBRL(totalMotos)} sub={`${motos.length} no pátio · ${formatBRL(totalMotosPago)} pago`} />
                  <StatCard icon="badge-check" label="Arrecadado" value={formatBRL(totalArrecadado)} sub="Carros + motos pagos" />
                  <StatCard icon="alarm-clock" label="Pendente" value={formatBRL(totalPendente)} sub={`Carro ${formatBRL(pendCarros)} · Moto ${formatBRL(pendMotos)}`} />
                </div>

                <div className="grid grid-cols-2 gap-2 sm:gap-3 mt-3">
                  <StatCard icon="wallet" label="Dinheiro" value={formatBRL(totalDinheiro)} sub={`Carro ${formatBRL(totalCarrosDinheiro)} · Moto ${formatBRL(totalMotosDinheiro)}${trocoTotal>0 ? ' · troco abatido '+formatBRL(trocoTotal) : ''}`} />
                  <StatCard icon="credit-card" label="Pix" value={formatBRL(totalPix)} sub={`Carro ${formatBRL(totalCarrosPix)} · Moto ${formatBRL(totalMotosPix)}`} />
                </div>

                {(totalCarrosSemMetodo > 0 || totalMotosSemMetodo > 0) && (
                        <div className="mt-3 text-xs text-amber-700 dark:text-amber-300 flex items-center gap-1.5">
                          <Icon name="circle-help" className="w-3.5 h-3.5 shrink-0" />
                          Há veículos pagos sem método informado — detalhe em Relatórios.
                        </div>
                )}
              </Section>

              <Section id="placas" title="Placas" subtitle="Gerencie entradas, pagamentos e valores" action={
                <button onClick={()=>irPara('relatorios')} className="hidden md:inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800">
                  <Icon name="pie-chart" className="w-4 h-4" />
                  Ir para Relatórios
                </button>
              }>
                <div className="grid grid-cols-1 gap-4 min-w-0">
                  <AddForm onAdd={addItem} />

                  <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center min-w-0">
                    <Tabs tab={tab} setTab={setTab} />
                    <PaymentFilter paymentFilter={paymentFilter} setPaymentFilter={setPaymentFilter} />
                    <div className="hidden sm:block flex-1"></div>
                    <div className="relative min-w-0">
                      <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" />
                      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar placa..."
                             className="w-full min-w-0 sm:w-64 pl-9 pr-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 outline-none focus:ring-4 focus:ring-blue-500/20"/>
                    </div>
                  </div>

                  <List items={items} search={search} tab={tab} paymentFilter={paymentFilter}
                        onUpdate={updateItem} onDelete={removeItem}
                  />
                </div>
              </Section>
              </div>
              )}

              {!loading && aba === 'config' && (
              <Section id="config" title="Configurações" subtitle="Tema, backup e mais">
                <ConfigPainel theme={theme} setTheme={setTheme} items={items} loadItems={loadItems} clearAll={clearAll} />
              </Section>
              )}

              {!loading && aba === 'relatorios' && (
              <Section id="relatorios" title="Relatórios" subtitle="Totais por tipo, status e método de pagamento">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white/70 dark:bg-zinc-900/40">
                    <h3 className="font-semibold mb-2 flex items-center gap-2"><Icon name="car" className="w-5 h-5" />Carros</h3>
                    <ul className="text-sm grid grid-cols-1 gap-1">
                      <li className="flex justify-between"><span>Total no pátio (pago + pendente)</span><span className="font-semibold">{formatBRL(totalCarros)}</span></li>
                      <li className="flex justify-between"><span>Arrecadado (pagos)</span><span className="font-semibold">{formatBRL(totalCarrosPago)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Dinheiro</span><span className="font-semibold">{formatBRL(totalCarrosDinheiro)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Pix</span><span className="font-semibold">{formatBRL(totalCarrosPix)}</span></li>
                      {totalCarrosSemMetodo > 0 && (
                              <li className="flex justify-between"><span className="ml-4">→ Não informado</span><span className="font-semibold">{formatBRL(totalCarrosSemMetodo)}</span></li>
                      )}
                      {trocoCarros > 0 && (
                              <li className="flex justify-between text-amber-700 dark:text-amber-300"><span className="ml-4">→ Troco devolvido (já abatido)</span><span className="font-semibold">{formatBRL(trocoCarros)}</span></li>
                      )}
                      <li className="flex justify-between"><span>Pendente</span><span className="font-semibold">{formatBRL(pendCarros)}</span></li>
                      <li className="flex justify-between"><span>Itens</span><span className="font-semibold">{carros.length}</span></li>
                    </ul>
                  </div>
                  <div className="p-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white/70 dark:bg-zinc-900/40">
                    <h3 className="font-semibold mb-2 flex items-center gap-2"><Icon name="motorbike" className="w-5 h-5" />Motos</h3>
                    <ul className="text-sm grid grid-cols-1 gap-1">
                      <li className="flex justify-between"><span>Total no pátio (pago + pendente)</span><span className="font-semibold">{formatBRL(totalMotos)}</span></li>
                      <li className="flex justify-between"><span>Arrecadado (pagos)</span><span className="font-semibold">{formatBRL(totalMotosPago)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Dinheiro</span><span className="font-semibold">{formatBRL(totalMotosDinheiro)}</span></li>
                      <li className="flex justify-between"><span className="ml-4">→ Pix</span><span className="font-semibold">{formatBRL(totalMotosPix)}</span></li>
                      {totalMotosSemMetodo > 0 && (
                              <li className="flex justify-between"><span className="ml-4">→ Não informado</span><span className="font-semibold">{formatBRL(totalMotosSemMetodo)}</span></li>
                      )}
                      {trocoMotos > 0 && (
                              <li className="flex justify-between text-amber-700 dark:text-amber-300"><span className="ml-4">→ Troco devolvido (já abatido)</span><span className="font-semibold">{formatBRL(trocoMotos)}</span></li>
                      )}
                      <li className="flex justify-between"><span>Pendente</span><span className="font-semibold">{formatBRL(pendMotos)}</span></li>
                      <li className="flex justify-between"><span>Itens</span><span className="font-semibold">{motos.length}</span></li>
                    </ul>
                  </div>
                </div>
              </Section>
              )}

              {!loading && aba === 'blacklist' && (
              <Section id="blacklist" title="Blacklist" subtitle="Veículos que saíram sem pagar">
                <div className="grid grid-cols-1 gap-4">
                  <BlacklistForm onAdd={addBlacklistEntry} />
                  <BlacklistList blacklist={blacklist} onDelete={removeBlacklistEntry} />
                </div>
              </Section>
              )}

              </main>

              <BottomNav navId={navId} irPara={irPara} />
            </div>
    )
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
