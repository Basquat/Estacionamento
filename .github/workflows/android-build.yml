name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api-base-url:
        description: 'URL base da API (termina em /api)'
        required: true
        default: 'https://estacionamento-uers.onrender.com/api'
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências e criar projeto Android
        run: |
          npm install
          npx cap add android

      - name: Ícone do app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1d4ed8' --iconBackgroundColorDark '#1d4ed8'

      - name: Permissão de câmera no AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$M"
          grep -n "CAMERA\|camera" "$M"

      - run: npx cap sync android

      - name: Chave de assinatura fixa (permite atualizar sem desinstalar)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando chave fixa."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 ausente: APK assinado com chave aleatoria (nao atualiza por cima)."
          fi

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Estaciona.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estaciona-apk
          path: mobile/Estaciona.apk

      - name: Publicar link de download (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Estaciona.apk --title "APK mais recente" --notes "Baixe o Estaciona.apk e instale no celular." --target "${{ github.sha }}"
