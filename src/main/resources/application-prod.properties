# Perfil de producao (SPRING_PROFILES_ACTIVE=prod, setado no Dockerfile).
# Sobrescreve o application.properties.

# --- Cold start ---
# O schema e gerido a mao no Supabase (rode o SQL novo antes de subir esta versao!).
# 'none' pula a introspeccao de schema no boot (varias idas ao Supabase + ~5s).
spring.jpa.hibernate.ddl-auto=none
# Hibernate nao abre conexao so para ler metadados no boot (dialeto ja e fixo).
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Beans criados sob demanda -> contexto sobe mais rapido.
spring.main.lazy-initialization=true

# Render injeta PORT - garantir que escute a porta correta
server.port=${PORT:8080}

# --- Logs / overhead ---
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Pool de conexoes (Render free + pooler do Supabase) ---
# Poucas conexoes: a instancia e pequena e o pooler do Supabase free tem limite
# baixo. 5 conexoes atendem de sobra e evitam fila/esgotamento.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.keepalive-time=120000

# --- Hibernate: agrupa INSERT/UPDATE dos pagamentos numa tacada ---
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Threads virtuais (Java 21): conexoes SSE abertas nao seguram threads caras ---
spring.threads.virtual.enabled=true

# --- Compressao das respostas JSON (NAO comprimir text/event-stream) ---
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Actuator em prod (nao sobrescreve o application.properties)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
