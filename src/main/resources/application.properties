spring.application.name=Estacionamento

# ---------------------------------------------------------------------------
# Banco de dados
#
# Nenhuma credencial fica aqui. As opcoes, em ordem de prioridade:
#   1. Variaveis de ambiente DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD
#      (é o que o Render usa em producao).
#   2. Um arquivo application-local.properties nesta mesma pasta (ignorado pelo
#      git) para rodar na sua maquina. Veja application-local.properties.example.
# ---------------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# O frontend e um unico index.html. no-cache = o navegador sempre revalida
# (304 rapido quando nao mudou, versao nova assim que muda) — evita ficar preso
# numa versao antiga apos deploy.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Actuator: expor somente /actuator/health para o UptimeRobot
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
